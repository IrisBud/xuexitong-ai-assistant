name: Refresh README badges

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/readme-badges.yml
      - scripts/update-readme-badges.mjs
  watch:
    types: [started]
  release:
    types: [published]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-badges
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh images using GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)
          stars=$(gh api "repos/$REPOSITORY" --jq .stargazers_count)
          node scripts/update-readme-badges.mjs "$version" "$stars"
          git add -- docs/readme/version.svg docs/readme/stars.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh README badges'
          git push origin HEAD:refs/heads/main
